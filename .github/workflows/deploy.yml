name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  # Production and the test environment are independent workers backed by independent D1
  # databases, so they deploy in parallel rather than queueing the test env behind production.
  production:
    runs-on: ubuntu-latest
    # Manual runs (workflow_dispatch) always proceed; runs triggered by the CI workflow only
    # proceed when CI actually passed, so a failing push to main can never trigger a deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
      CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - uses: actions/cache@v4
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}",
            restore-keys: 'bun-${{ runner.os }}-',
          }
      - run: bun install --frozen-lockfile
      - name: Guard against a development wrangler.jsonc
        run: |
          if grep -q '"APP_ENV": "development"' wrangler.jsonc || grep -q 'localhost:3000' wrangler.jsonc; then
            echo "::error file=wrangler.jsonc::wrangler.jsonc still has development placeholders (APP_ENV=\"development\" and/or APP_URL=localhost:3000). Point APP_URL at your domain and set APP_ENV to \"production\" before deploying — see README.md#deploying." >&2
            exit 1
          fi
      # The privacy policy tells users their data is stored under Cloudflare's EU jurisdiction.
      # A D1 database's jurisdiction is fixed at creation and invisible in wrangler.jsonc, so
      # nothing else would catch a database swapped for an unrestricted one. See #39.
      - name: Guard against a non-EU production database
        run: |
          jurisdiction=$(bunx wrangler d1 info whenweall-eu --json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("jurisdiction") or "none")')
          if [ "$jurisdiction" != "eu" ]; then
            echo "::error::production D1 reports jurisdiction '$jurisdiction', expected 'eu'." >&2
            exit 1
          fi
          echo "production D1 jurisdiction: $jurisdiction"
      - run: bun run db:migrate:remote
      - run: bun run deploy

  test-env:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
      CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - uses: actions/cache@v4
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}",
            restore-keys: 'bun-${{ runner.os }}-',
          }
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate:remote:test
      - run: bun run deploy:test
