name: CI
on:
  # Tags are here, not only main, because the release job at the bottom of this file publishes
  # from them — and it must never publish anything this workflow has not just proven.
  push: { branches: [main], tags: ['v*'] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: 'ci-${{ github.ref }}'
  # PR runs are superseded by their own next push, so cancelling them is free. A main or tag run
  # is NOT cancellable: it ends in a multi-arch image push, and a half-pushed manifest is worse
  # than a slightly stale queue. (This is why the publish job can live here at all — see it.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Backend: vet + lint + the full suite against a real Postgres (testcontainers-go spins up its
  # own container — nothing to provision here), plus a second, narrower pass under the race
  # detector for the handful of packages where "two requests racing the same slot" is the actual
  # thing under test.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...
      # Generated sqlc code must match the checked-in schema + queries: a stale models.go or
      # *.sql.go (someone edited a migration or a query and forgot `sqlc generate`) fails here
      # instead of drifting silently until the next regeneration produces an unrelated diff.
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'
      - run: sqlc diff
      - uses: golangci/golangci-lint-action@v9
      - run: go test ./...
      # internal/rooms runs UNFILTERED: this whole package IS the concurrency-sensitive surface
      # (the hub's watermark/dispatch state, presence counting, the keepalive goroutine racing
      # read/write pumps, shutdown draining, ...), not just the handful of tests a name filter
      # would happen to catch. polls/bookings/auth/jobs/db stay scoped by name to keep the job
      # fast: their concurrent-writer tests (claim races, double-booking, personal-org creation,
      # job claiming, the sync.Once-guarded concurrent migrate) all carry one of these tokens in
      # their name — keep that true when adding one.
      - run: go test -race ./internal/rooms/...
      - run: go test -race -run 'Race|Concurrent|Winner|LateCommitter|Slow' ./internal/polls/... ./internal/bookings/... ./internal/auth/... ./internal/jobs/... ./internal/db/...

  # Frontend: the SPA under web/ has its own toolchain (bun) entirely separate from the root
  # package.json, which exists only for Playwright's e2e suite below.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: web/.bun-version }
      - uses: actions/cache@v6
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-web-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}",
            restore-keys: 'bun-web-${{ runner.os }}-',
          }
      - run: cd web && bun install --frozen-lockfile
      - run: cd web && bun run typecheck
      - run: cd web && bun run lint
      - run: cd web && bunx vitest run

  # An unpushed multi-arch build over the same route release.yml takes: binaries cross-compiled
  # natively here, then a COPY-only Dockerfile. Not a byte-identical release image — this stamps
  # VERSION=dev and skips the SBOM, provenance and metadata labels release.yml attaches — but it
  # exercises the part that can break. Because nothing compiles inside the image any more, building
  # BOTH platforms costs a couple of seconds, so the arm64 leg is proven on every PR rather than
  # first at release time; build-artifacts.sh checks each binary's GOARCH, since a COPY never
  # would. No setup-qemu-action, by design — see release.yml.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: web/.bun-version }
      - uses: actions/cache@v6
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-docker-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}",
            restore-keys: 'bun-docker-${{ runner.os }}-',
          }
      - run: bash scripts/build-artifacts.sh linux/amd64 linux/arm64
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly .

  # Playwright is the oracle for the whole rewrite: it drives the real, built SPA served by the
  # real Go binary (e2e/run-server.sh, this job's own webServer command) against two throwaway
  # `docker run` containers (Postgres, Mailpit) — needs the Docker daemon ubuntu-latest already
  # ships with, nothing else to provision.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: web/.bun-version }
      - uses: actions/cache@v6
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-e2e-${{ runner.os }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}",
            restore-keys: 'bun-e2e-${{ runner.os }}-',
          }
      - run: bun install --frozen-lockfile
      - run: cd web && bun install --frozen-lockfile
      # Keyed on the resolved @playwright/test version so a browser bump misses the cache and
      # re-downloads, rather than silently testing against a stale Chromium.
      - id: pw
        run: echo "version=$(bun pm ls | grep -o '@playwright/test@[^ ]*' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          {
            path: ~/.cache/ms-playwright,
            key: 'playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}',
          }
      # The browser binary comes from the cache when it hits; the OS-level shared libraries that
      # `--with-deps` installs live outside ~/.cache and are always needed.
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  # The same Playwright suite, this time against the built Docker image running under compose's
  # hardening flags (read_only, cap_drop ALL, no-new-privileges, USER 65532, the binary's own
  # HEALTHCHECK) — spec §9's "runs in CI against the real built Docker image + Postgres — proves
  # the port and keeps the hardening claims honest". `e2e` above keeps covering the fast `go run`
  # path; this job proves the distroless image (tzdata, CA bundle, no shell) is what passes.
  e2e-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: web/.bun-version }
      - uses: actions/cache@v6
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-e2e-image-${{ runner.os }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}",
            restore-keys: 'bun-e2e-image-${{ runner.os }}-',
          }
      # The root package is Playwright's; scripts/build-artifacts.sh installs web/'s own deps
      # itself, because it is the thing that builds the SPA.
      - run: bun install --frozen-lockfile
      - id: pw
        run: echo "version=$(bun pm ls | grep -o '@playwright/test@[^ ]*' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          {
            path: ~/.cache/ms-playwright,
            key: 'playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}',
          }
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      # Only this runner's architecture: the image under test runs here, and the arm64 leg is
      # already proven by the `docker` job above.
      - name: Cross-compile the binary and build the SPA into it
        run: bash scripts/build-artifacts.sh host
      - name: Build the release image
        run: docker build -t whenweall:e2e .
      - name: Start Postgres + Mailpit + the image with the hardening flags
        run: e2e/compose-e2e.sh up -d --wait --wait-timeout 120
      - name: Assert the hardening flags are live
        run: e2e/assert-hardening.sh
      - name: Playwright against the image
        run: bunx playwright test
        env: { E2E_SERVER: image }
      - name: App logs
        if: failure()
        run: |
          mkdir -p playwright-report
          e2e/compose-e2e.sh logs --no-color app > playwright-report/app.log || true
          e2e/compose-e2e.sh ps > playwright-report/compose-ps.txt || true
      - name: Tear the stack down
        if: always()
        run: e2e/compose-e2e.sh down -v --remove-orphans
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report-image, path: playwright-report, retention-days: 7 }

  # Publishes the multi-arch image to ghcr — the last job in this file, and deliberately IN this
  # file rather than a workflow of its own.
  #
  # It used to be release.yml, triggered by `push` to main and to a v* tag, with no dependency on
  # CI at all: an image was published for every commit, passing or failing, and the two workflows
  # raced. The obvious repair — `on: workflow_run: [CI]` — is the one #49 was actually filed
  # about: for a workflow_run event `github.sha` resolves to the head of the default branch WHEN
  # THE DEPLOY RUNS, not to the commit whose CI passed, so two pushes landing close together
  # publish the second commit off the first commit's green run. Getting it right means
  # remembering `github.event.workflow_run.head_sha` at every checkout, and re-deriving the tag
  # name from `head_branch` because `github.ref` is wrong there too.
  #
  # `needs` has neither problem. There is one run, one checkout, one SHA, and the image cannot be
  # built until every gate on it has passed on that exact tree.
  release:
    needs: [go, web, docker, e2e, e2e-image]
    # A fork must not try (and fail, loudly) to push into the upstream owner's registry under its
    # own copy of this workflow. The ref check is what keeps PR runs from publishing: `needs`
    # decides ordering, not whether this is a releasable ref.
    if: >-
      github.repository == 'refsdal/whenweall' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7

      # cmd/whenweall's own `version` subcommand wants a real version string: the pushed tag for a
      # release, a "main-<short sha>" marker for a rolling main build. It reaches the binary as an
      # env var read by scripts/build-artifacts.sh, which passes it to `-ldflags -X main.version`;
      # there is no Docker build-arg any more, because the Dockerfile no longer compiles anything.
      # (Image LABELs are metadata-action's job, below, and always were.) Kept as a plain shell
      # step rather than leaning on metadata-action's own `version` output, which is resolved from
      # tag-priority rules not obviously the same thing.
      - name: Resolve the version string
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Image tags: a version tag push (v1.2.3) publishes semver tags (1.2.3, 1.2); a push to
      # main moves `latest`.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/refsdal/whenweall
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Both toolchains run NATIVELY on the amd64 runner. This is the whole point of the split
      # between scripts/build-artifacts.sh and the Dockerfile: the SPA is compiled once (its output
      # is architecture-independent) and the Go compiler cross-compiles the arm64 binary, so
      # nothing below ever runs under QEMU. There is deliberately no setup-qemu-action here — if
      # one reappears, something has started compiling inside the image again.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: web/.bun-version }
      - uses: actions/cache@v6
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-release-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}",
            restore-keys: 'bun-release-${{ runner.os }}-',
          }

      - name: Build the per-platform binaries natively
        run: bash scripts/build-artifacts.sh linux/amd64 linux/arm64
        env:
          VERSION: ${{ steps.version.outputs.value }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Seconds of file copying: the Dockerfile COPYs one already-built binary per platform.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
