name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      # `setup-bun` caches the bun binary, not the module cache bun installs from. Keying on
      # bun.lock means a run only pays the network cost when a dependency actually changed.
      - uses: actions/cache@v4
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}",
            restore-keys: 'bun-${{ runner.os }}-',
          }
      - run: bun install --frozen-lockfile
      - run: cp .dev.vars.example .dev.vars
      - run: bun run cf-typegen
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

  # Split out of `checks` so the ~1m of typecheck/lint/format/build runs *beside* the suite
  # instead of ahead of it, and sharded because the workers project is pinned to `maxWorkers: 4`
  # (see vitest.config.ts) — on a 4-core runner that is the ceiling, not spare headroom, so the
  # only way to add parallelism is to add runners.
  #
  # Two shards, deliberately not more: e2e is ~2m40s and cannot be shortened by sharding this
  # suite, so once a shard drops below that it stops moving the critical path and just costs
  # another runner. Vitest shards by file count rather than duration, so the two are uneven
  # (measured locally: 75s and 116s of a 168s whole) — the slower one is what to watch.
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report both shards' failures rather than cancelling the sibling on the first red one.
      fail-fast: false
      matrix: { shard: [1, 2] }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - uses: actions/cache@v4
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}",
            restore-keys: 'bun-${{ runner.os }}-',
          }
      - run: bun install --frozen-lockfile
      - run: cp .dev.vars.example .dev.vars
      # `bun run` appends what follows `--` to the script, so this expands to
      # `vitest run --shard=N/2` — the shard split stays in the workflow, not in package.json.
      - run: bun run test -- --shard=${{ matrix.shard }}/2

  # Deliberately NOT `needs:` anything. e2e builds and exercises the app itself, so it does not
  # depend on lint/typecheck/unit results — gating it behind them only added its ~2min to the
  # critical path of every green run. A broken PR now burns one extra runner instead.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - uses: actions/cache@v4
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}",
            restore-keys: 'bun-${{ runner.os }}-',
          }
      - run: bun install --frozen-lockfile
      - run: cp .dev.vars.example .dev.vars
      # Keyed on the resolved @playwright/test version so a browser bump misses the cache and
      # re-downloads, rather than silently testing against a stale Chromium.
      - id: pw
        run: echo "version=$(bun pm ls | grep -o '@playwright/test@[^ ]*' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          {
            path: ~/.cache/ms-playwright,
            key: 'playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}',
          }
      # The browser binary comes from the cache when it hits; the OS-level shared libraries that
      # `--with-deps` installs live outside ~/.cache and are always needed.
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - run: bun run db:migrate:local
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
      - run: go test ./...
      - run: docker build .
