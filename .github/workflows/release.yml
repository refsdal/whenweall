name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
# Never cancel a publish mid-push — a half-pushed multi-arch manifest is worse than a slightly
# stale queue. One release at a time per ref is still enough to avoid two runs racing the same tag.
concurrency: { group: 'release-${{ github.ref }}', cancel-in-progress: false }
jobs:
  build-and-push:
    # Guards a fork from trying (and failing, loudly) to push into the upstream owner's package
    # registry under its own copy of this workflow.
    if: github.repository == 'refsdal/whenweall'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cmd/whenweall's own `version` subcommand wants a real version string: the pushed tag for a
      # release, a "main-<short sha>" marker for a rolling main build. It reaches the binary as an
      # env var read by scripts/build-artifacts.sh, which passes it to `-ldflags -X main.version`;
      # there is no Docker build-arg any more, because the Dockerfile no longer compiles anything.
      # (Image LABELs are metadata-action's job, above, and always were.) Kept as a plain shell
      # step rather than leaning on metadata-action's own `version` output, which is resolved from
      # tag-priority rules not obviously the same thing.
      - name: Resolve the version string
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Image tags: a version tag push (v1.2.3) publishes semver tags (1.2.3, 1.2); a push to
      # main additionally (and only then) publishes `latest`, so `latest` always tracks main, not
      # whatever the most recent release tag happened to be.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/refsdal/whenweall
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Both toolchains run NATIVELY on the amd64 runner. This is the whole point of the split
      # between scripts/build-artifacts.sh and the Dockerfile: the SPA is compiled once (its output
      # is architecture-independent) and the Go compiler cross-compiles the arm64 binary, so
      # nothing below ever runs under QEMU. There is deliberately no setup-qemu-action here — if
      # one reappears, something has started compiling inside the image again.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: web/.bun-version }
      - uses: actions/cache@v4
        with:
          {
            path: ~/.bun/install/cache,
            key: "bun-release-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}",
            restore-keys: 'bun-release-${{ runner.os }}-',
          }

      - name: Build the per-platform binaries natively
        run: bash scripts/build-artifacts.sh linux/amd64 linux/arm64
        env:
          VERSION: ${{ steps.version.outputs.value }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Seconds of file copying: the Dockerfile COPYs one already-built binary per platform.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
